<title>Dino-Ausgrabung</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.g{font-family:'Fredoka',system-ui,sans-serif}
:where(.g button){font-family:inherit;padding:0;border:0;background:none;cursor:pointer}
.hide{display:none}
.spot{position:absolute;z-index:5}
.spot svg{display:block;transition:transform .15s}
.spot:hover svg{transform:scale(1.06)}
.spot.wig{animation:wig .5s}
.nav{position:absolute;width:100px;height:100px;z-index:6;transition:transform .15s}
.nav:hover{transform:scale(1.08)}
.hud{position:absolute;top:16px;width:64px;height:64px;z-index:50;transition:transform .15s}
.hud:hover{transform:scale(1.1)}
.slot{position:absolute;width:72px;height:72px;border-radius:50%;border:4px dashed transparent;z-index:8}
.slot.hint{border-color:#ffb300;background:rgba(255,200,0,.2);animation:pulse 1.1s infinite}
.slot.wig{animation:wig .5s}
.inv{position:absolute;top:622px;width:86px;height:86px;border-radius:20px;background:#fff3d6;border:5px solid #2b2118;z-index:31;transition:transform .15s}
.inv .ico{display:block;width:64px;height:64px;margin:auto}
.inv.empty .ico{opacity:.22;filter:grayscale(1)}
.inv.done .ico{opacity:.4}
.inv.sel{background:#ffe27a;border-color:#d97706;transform:translateY(-10px)}
.inv.popin{animation:popin .6s ease-out}
.tool{position:absolute;top:622px;width:86px;height:86px;border-radius:20px;background:#d9ecff;border:5px solid #2b2118;z-index:31;transition:transform .15s}
.tool .ico{display:block;width:64px;height:64px;margin:auto}
.tool.sel{background:#8ed0ff;border-color:#1d6fd8;transform:translateY(-10px)}
.tool.hint{animation:pulse 1.1s infinite}
.dot{position:absolute;top:650px;width:44px;height:44px;border-radius:50%;background:#fff3d6;border:4px solid #2b2118;font-size:18px;font-weight:700;color:#2b2118;z-index:31;display:flex;align-items:center;justify-content:center}
.dot.done{background:#8be28b}
.dot.cur{background:#ffd23f;transform:translateY(-6px)}
.card{position:absolute;width:214px;height:228px;border-radius:24px;border:6px solid #2b2118;background:#fff3d6;overflow:hidden;z-index:6;transition:transform .15s;display:flex;flex-direction:column;align-items:center;color:#2b2118;padding-top:8px;box-sizing:border-box}
.card:hover{transform:translateY(-8px) rotate(-1deg)}
.thumb{width:186px;height:96px;border-radius:14px;border:4px solid #2b2118;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:#fff;text-shadow:3px 3px 0 #2b2118,-2px -2px 0 #2b2118,2px -2px 0 #2b2118,-2px 2px 0 #2b2118}
.thumb.th0{background:linear-gradient(#7fd0f2 60%,#f4d489 60%)}
.thumb.th1{background:linear-gradient(#8fe3c8 60%,#8bc34a 60%)}
.thumb.th2{background:linear-gradient(#8fd8ff 40%,#3aa7e0 40% 62%,#f7e2a8 62%)}
.thumb.th3{background:linear-gradient(#9fb4c8 60%,#b9b2a6 60%)}
.thumb.th4{background:linear-gradient(#0f1b3d 60%,#8a7aa0 60%)}
.thumb.th5{background:linear-gradient(#7a2a1a 60%,#4a3a38 60%)}
.thumb.th6{background:linear-gradient(#bfe3f5 60%,#f2f8ff 60%)}
.thumb.th7{background:linear-gradient(#ffb070 60%,#d9915a 60%)}
.thumb.th8{background:linear-gradient(#a7c79a 60%,#7a9a5a 60%)}
.thumb.th9{background:linear-gradient(#6ec6ff 40%,#2f8fd0 40% 62%,#8bc34a 62%)}
.g .again{width:52px;height:52px;border-radius:50%;background:#fff;border:4px solid #2b2118;display:flex;align-items:center;justify-content:center}
.g .cbtn{height:52px;border-radius:26px;padding:0 20px;background:#fff;border:4px solid #2b2118;font-size:22px;font-weight:700;color:#2b2118;display:flex;align-items:center}
.g button:focus-visible{outline:4px solid #1d6fd8;outline-offset:3px}
.e{display:none}
.th0 .e-sun,.th0 .e-cloud,.th0 .e-mesa,.th0 .e-cactus,.th0 .e-tent,.th0 .e-palmR,
.th1 .e-sun,.th1 .e-cloud,.th1 .e-volcano,.th1 .e-palmL,.th1 .e-palmR,.th1 .e-fern,
.th2 .e-sun,.th2 .e-cloud,.th2 .e-sea,.th2 .e-parasol,.th2 .e-palmR,
.th3 .e-cloud,.th3 .e-peaks,.th3 .e-tent,.th3 .e-boulders,
.th4 .e-moon,.th4 .e-mesa,.th4 .e-cactus,.th4 .e-tent,
.th5 .e-volcano,.th5 .e-lava,.th5 .e-boulders,
.th6 .e-peaks,.th6 .e-snow,.th6 .e-pines,.th6 .e-cloud,
.th7 .e-sun,.th7 .e-mesa,.th7 .e-cactus,.th7 .e-boulders,
.th8 .e-cloud,.th8 .e-pond,.th8 .e-fern,.th8 .e-palmL,.th8 .e-palmR,
.th9 .e-sun,.th9 .e-cloud,.th9 .e-sea,.th9 .e-volcano,.th9 .e-palmL,.th9 .e-palmR{display:inline}
.th2 .hl,.th9 .hl{display:none}
.pitR{display:none}
.lay-rect .pitE{display:none}
.lay-rect .pitR{display:inline}
.dx{display:none}
.th0 .dx-d,.th1 .dx-j,.th2 .dx-s,.th3 .dx-g,.th4 .dx-n,.th5 .dx-v,.th6 .dx-i,.th7 .dx-c,.th8 .dx-m,.th9 .dx-p{display:inline}
.th0 .mb{fill:#dcaa5a}.th0 .ms{fill:#b88a3e}.th0 .rb{fill:#c9885a}.th0 .hb{fill:#c99250}.th0 .lb{fill:#f0d79a}.th0 .lbs{stroke:#d1a95f}
.th1 .mb{fill:#7a5a30}.th1 .ms{fill:#4e3a20}.th1 .rb{fill:#7f9a7a}.th1 .hb{fill:#6b4a2a}.th1 .lb{fill:#9cbf6a}.th1 .lbs{stroke:#6f9a42}
.th2 .mb{fill:#f2dc9a}.th2 .ms{fill:#d8bc70}.th2 .rb{fill:#d9c7a8}.th2 .hb{fill:#ebd18a}.th2 .lb{fill:#f9ecc0}.th2 .lbs{stroke:#dcc680}
.th3 .mb{fill:#a8a196}.th3 .ms{fill:#8a847a}.th3 .rb{fill:#6f7882}.th3 .hb{fill:#9a9387}.th3 .lb{fill:#c4beb2}.th3 .lbs{stroke:#9a9488}
.th4 .mb{fill:#6e5e9a}.th4 .ms{fill:#54467c}.th4 .rb{fill:#5a6a9a}.th4 .hb{fill:#5a4c82}.th4 .lb{fill:#8a7ab8}.th4 .lbs{stroke:#6a5a98}
.th5 .mb{fill:#4a3a38}.th5 .ms{fill:#2a1c1a}.th5 .rb{fill:#3a3a44}.th5 .hb{fill:#3a2a28}.th5 .lb{fill:#6a4a40}.th5 .lbs{stroke:#ff7a3d}
.th6 .mb{fill:#e8f2fb}.th6 .ms{fill:#bcd4e8}.th6 .rb{fill:#a8cbe6}.th6 .hb{fill:#d4e6f4}.th6 .lb{fill:#f4faff}.th6 .lbs{stroke:#bcd4e8}
.th7 .mb{fill:#d28450}.th7 .ms{fill:#a8602f}.th7 .rb{fill:#b8603a}.th7 .hb{fill:#c06a3c}.th7 .lb{fill:#e8a070}.th7 .lbs{stroke:#b8603a}
.th8 .mb{fill:#5a6a3a}.th8 .ms{fill:#3e4a28}.th8 .rb{fill:#6a7a5a}.th8 .hb{fill:#4a5a30}.th8 .lb{fill:#8aa05a}.th8 .lbs{stroke:#5f7a3a}
.th9 .mb{fill:#c0905a}.th9 .ms{fill:#a06e3a}.th9 .rb{fill:#8a9a8a}.th9 .hb{fill:#a87a48}.th9 .lb{fill:#d8b878}.th9 .lbs{stroke:#b09050}
.card.locked{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.card.locked:hover{transform:none}
.dot.lockd{opacity:.35;filter:grayscale(1);cursor:not-allowed}
.vo{fill:#7a5a4a}.pm{fill:#4caf50}.pn{fill:#2e7d4a}
.th0 .s1{stop-color:#7fd0f2}.th0 .s2{stop-color:#fdf0c8}.th0 .gr{fill:#f4d489}.th0 .p1{fill:#e2b36a}.th0 .p2{fill:#cf9650}.th0 .pl{stroke:#b8803a}.th0 .hl{fill:#eac177}.th0 .m1{fill:#e6935a}.th0 .m2{fill:#d9824a}
.th1 .s1{stop-color:#8fe3c8}.th1 .s2{stop-color:#fff4c0}.th1 .gr{fill:#8bc34a}.th1 .p1{fill:#b07c48}.th1 .p2{fill:#8f6030}.th1 .pl{stroke:#6f4824}.th1 .hl{fill:#4caf50}
.th2 .s1{stop-color:#8fd8ff}.th2 .s2{stop-color:#eaf8ff}.th2 .gr{fill:#f7e2a8}.th2 .p1{fill:#e9c77f}.th2 .p2{fill:#d3a95f}.th2 .pl{stroke:#b8873c}.th2 .sea{fill:#3aa7e0}
.th3 .s1{stop-color:#9fb4c8}.th3 .s2{stop-color:#e6e0d4}.th3 .gr{fill:#b9b2a6}.th3 .p1{fill:#9a948a}.th3 .p2{fill:#7d776d}.th3 .pl{stroke:#666058}.th3 .hl{fill:#a39c90}.th3 .pk{fill:#8d8a86}.th3 .pc{fill:#e8e8e8}
.th4 .s1{stop-color:#0f1b3d}.th4 .s2{stop-color:#3a4a8a}.th4 .gr{fill:#8a7aa0}.th4 .p1{fill:#6e5e86}.th4 .p2{fill:#58496e}.th4 .pl{stroke:#483c5c}.th4 .hl{fill:#6a5a88}.th4 .m1{fill:#4a3a6a}.th4 .m2{fill:#3a2c58}
.th5 .s1{stop-color:#5a1a1a}.th5 .s2{stop-color:#ff9a4a}.th5 .gr{fill:#4a3a38}.th5 .p1{fill:#3a2a28}.th5 .p2{fill:#2a1c1a}.th5 .pl{stroke:#1a100f}.th5 .hl{fill:#5a3a34}.th5 .vo{fill:#4a2f2a}
.th6 .s1{stop-color:#bfe3f5}.th6 .s2{stop-color:#ffffff}.th6 .gr{fill:#f2f8ff}.th6 .p1{fill:#d4e4f2}.th6 .p2{fill:#b8cde0}.th6 .pl{stroke:#98b4cc}.th6 .hl{fill:#dcecf8}.th6 .pk{fill:#a6c8e6}.th6 .pc{fill:#ffffff}.th6 .pn{fill:#4a8a6a}
.th7 .s1{stop-color:#ffb070}.th7 .s2{stop-color:#ffe9c0}.th7 .gr{fill:#d9915a}.th7 .p1{fill:#c27a45}.th7 .p2{fill:#a5622f}.th7 .pl{stroke:#85501f}.th7 .hl{fill:#c97a47}.th7 .m1{fill:#c9663a}.th7 .m2{fill:#a84f2c}
.th8 .s1{stop-color:#a7c79a}.th8 .s2{stop-color:#e8efc0}.th8 .gr{fill:#7a9a5a}.th8 .p1{fill:#5a7040}.th8 .p2{fill:#465a30}.th8 .pl{stroke:#34452a}.th8 .hl{fill:#6b8f4a}
.th9 .s1{stop-color:#6ec6ff}.th9 .s2{stop-color:#fff0c0}.th9 .gr{fill:#8bc34a}.th9 .p1{fill:#b07c48}.th9 .p2{fill:#8f6030}.th9 .pl{stroke:#6f4824}.th9 .sea{fill:#2f8fd0}
.L0,.L1,.L2,.L3,.L4,.R0,.R1,.R2,.R3,.R4{display:none}
.cl0 .L0,.cl1 .L1,.cl2 .L2,.cl3 .L3,.cl4 .L4,.cr0 .R0,.cr1 .R1,.cr2 .R2,.cr3 .R3,.cr4 .R4{display:inline}
.t0 .wl{fill:#bfe3da}.t0 .wn{fill:#8fc9bc}
.t1 .wl{fill:#fbd9a6}.t1 .wn{fill:#e8a86a}
.t2 .wl{fill:#d3cdf2}.t2 .wn{fill:#a59ad8}
.t3 .wl{fill:#f6c9c9}.t3 .wn{fill:#e08a8a}
.t4 .wl{fill:#c9dcf6}.t4 .wn{fill:#7fa4de}
.t5 .wl{fill:#e6f2b8}.t5 .wn{fill:#aacb55}
.t6 .wl{fill:#fff0b8}.t6 .wn{fill:#e0b84c}
.t7 .wl{fill:#d9f0f0}.t7 .wn{fill:#7cc4c9}
.t8 .wl{fill:#f3d3ee}.t8 .wn{fill:#c985c0}
.t9 .wl{fill:#dcdcdc}.t9 .wn{fill:#9aa0a6}
.a-idle{animation:idle 2.4s ease-in-out infinite}
.a-walk{animation:walk .32s ease-in-out infinite}
.a-dig{animation:dig .55s ease-in-out infinite}
.a-brush{animation:brush .28s ease-in-out infinite}
.a-drill{animation:drill .12s linear infinite}
.exarm{transform-origin:120px 84px}
.exwork{animation:exarm .8s ease-in-out infinite}
.tw{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.po,.pi{fill:none;stroke-linecap:round;stroke-linejoin:round}
.po{stroke:#2b2118}
.pi{stroke:#f7ecd2}
.pf{fill:#f7ecd2;stroke:#2b2118;stroke-width:5;stroke-linejoin:round}
.detF{fill:#2b2118;stroke:none}
.detS{fill:none;stroke:#2b2118;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.on.fresh{animation:bonepop .5s ease-out;transform-box:fill-box;transform-origin:center}
.on .pi.seg{stroke-dasharray:20 6;stroke-linecap:butt}
.off .po{stroke:rgba(150,128,96,.6);stroke-dasharray:8 8}
.off .pi{stroke:transparent}
.off .pf{fill:rgba(255,255,255,.25);stroke:rgba(150,128,96,.6);stroke-dasharray:8 8}
.off .detF,.off .detS{display:none}
.skwrap.tada{animation:tada 1s ease-in-out infinite}
.vb1{animation:vbob 2.2s ease-in-out infinite}
.vb2{animation:vbob 2.9s ease-in-out infinite .4s}
.vb3{animation:vbob 1.8s ease-in-out infinite .2s}
.vwalk{animation:vwalk 28s linear infinite}
.dirt{position:absolute;width:14px;height:14px;border-radius:50%;background:#8a5a2b;border:3px solid #2b2118;z-index:22;pointer-events:none;animation-duration:.55s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.dirt1{animation-name:dirt1}
.dirt2{animation-name:dirt2}
.dirt3{animation-name:dirt3}
.conf{position:absolute;top:0;animation:conf 3.2s linear infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes dig{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(6px) rotate(5deg)}}
@keyframes brush{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(12px) rotate(5deg)}}
@keyframes drill{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,3px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-2px,-3px)}}
@keyframes exarm{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,179,0,.8)}70%{box-shadow:0 0 0 18px rgba(255,179,0,0)}}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes popin{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bonepop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes burst{0%{transform:scale(.2) rotate(0);opacity:1}100%{transform:scale(1.5) rotate(40deg);opacity:0}}
@keyframes dirt1{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-44px,-80px);opacity:0}}
@keyframes dirt2{0%{transform:translate(0,0);opacity:1}100%{transform:translate(0,-96px);opacity:0}}
@keyframes dirt3{0%{transform:translate(0,0);opacity:1}100%{transform:translate(44px,-80px);opacity:0}}
@keyframes conf{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(780px) rotate(540deg)}}
@keyframes tada{0%,100%{transform:scale(1)}30%{transform:scale(1.03) rotate(-.6deg)}60%{transform:scale(1.03) rotate(.6deg)}}
@keyframes vbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes vwalk{0%{transform:translateX(0) scaleX(1)}49%{transform:translateX(520px) scaleX(1)}50%{transform:translateX(520px) scaleX(-1)}99%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.hs,.ht,.bt,.gl{display:none}
.hs-1 .hs1,.hs-2 .hs2,.hs-3 .hs3,.hs-4 .hs4,.ht-1 .ht1,.ht-2 .ht2,.ht-3 .ht3,.ht-4 .ht4,.ht-5 .ht5,.bt-0 .bt0,.bt-1 .bt1,.bt-2 .bt2,.gn-g .gl{display:inline}
.sw{width:44px;height:44px;border-radius:50%;border:4px solid #2b2118;position:relative;flex:none;transition:transform .12s}
.sw.sel{transform:scale(1.18);box-shadow:0 0 0 4px #ffd23f,0 0 0 7px #2b2118}
.opt{height:44px;padding:0 14px;border-radius:22px;border:4px solid #2b2118;background:#fff;font-size:18px;font-weight:700;color:#2b2118;flex:none}
.opt.sel{background:#ffd23f}
.gbtn{width:170px;height:56px;border-radius:28px;border:4px solid #2b2118;background:#fff;font-size:26px;font-weight:700;color:#2b2118}
.gbtn.sel{background:#ffd23f;box-shadow:0 0 0 4px #fff,0 0 0 7px #2b2118}
.startbtn{position:absolute;left:510px;top:290px;width:260px;height:260px;border-radius:50%;background:#ffd23f;border:8px solid #2b2118;box-shadow:0 10px 0 #2b2118;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;animation:startpulse 1.8s ease-in-out infinite}
.startbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #2b2118}
.bigbtn{position:absolute;height:80px;border-radius:40px;background:#ffd23f;border:6px solid #2b2118;box-shadow:0 6px 0 #2b2118;font-size:34px;font-weight:700;color:#2b2118;z-index:6}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2b2118}
.sw2{width:84px;height:44px;border-radius:22px;border:4px solid #2b2118;background:#ddd;font-size:18px;font-weight:700;color:#2b2118}
.sw2.on{background:#6cd36c}
@keyframes startpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

@media (prefers-reduced-motion: reduce){.g *{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>

<style>
html,body{margin:0;height:100%;background:#2b2118;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0}
</style>
</head>
<body>
<div id="stage"><div id="app" style="width:1280px;height:720px"></div></div>
<template id="tpl">

<div class="g" style="position:relative;width:1280px;height:720px;overflow:hidden;background:#fdf0c8;user-select:none">

<!-- ===================== LAUNCH ===================== -->
<sc-if value="{{ isLaunch }}" hint-placeholder-val="{{ false }}">

<defs><linearGradient id="skyL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ec8f2"/><stop offset="1" stop-color="#fdf0c8"/></linearGradient></defs>

<g stroke="#2b2118" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
<circle cx="1150" cy="280" r="58" fill="#ffd23f"/>
<path d="M430 130 A24 24 0 0 1 436 84 A36 36 0 0 1 506 72 A32 32 0 0 1 566 92 A26 26 0 0 1 586 130 Z" fill="#fff" transform="translate(-380,170)"/>
<path d="M430 130 A24 24 0 0 1 436 84 A36 36 0 0 1 506 72 A32 32 0 0 1 566 92 A26 26 0 0 1 586 130 Z" fill="#fff" transform="translate(500,150) scale(.8)"/>
<path d="M0 560 Q160 470 340 540 Q540 480 760 550 Q980 470 1180 540 Q1240 520 1280 540 V720 H0 Z" fill="#eec677"/>
<path d="M0 620 Q300 580 640 612 T1280 600 V720 H0 Z" fill="#f4d489"/>
<g transform="rotate(-18 220 640)"><circle cx="150" cy="634" r="14" fill="#f7ecd2"/><circle cx="150" cy="662" r="14" fill="#f7ecd2"/><circle cx="290" cy="634" r="14" fill="#f7ecd2"/><circle cx="290" cy="662" r="14" fill="#f7ecd2"/><rect x="150" y="634" width="140" height="28" fill="#f7ecd2" stroke="none"/><path d="M150 634 H290 M150 662 H290" fill="none"/></g>

</g>
</svg>
<div style="position:absolute;left:0;top:70px;width:1280px;text-align:center;font-size:90px;font-weight:700;color:#ffd23f;letter-spacing:3px;text-shadow:6px 6px 0 #2b2118,-4px -4px 0 #2b2118,4px -4px 0 #2b2118,-4px 4px 0 #2b2118;z-index:4;line-height:1">DINO-AUSGRABUNG</div>
<button class="startbtn" aria-label="Spiel starten" onClick="{{ startGame }}">
<svg viewBox="0 0 120 120" width="170" height="170" aria-hidden="true">
<g transform="rotate(-35 60 60)" stroke="#2b2118" stroke-width="5" stroke-linejoin="round" fill="#fff">

<rect x="20" y="46" width="80" height="28" stroke="none"/>
<path d="M26 46 H94 M26 74 H94" fill="none"/>
</g>
</svg>
<span style="font-size:44px;font-weight:700;color:#2b2118;line-height:1;margin-top:-6px">START</span>
</button>
</sc-if>

<!-- ===================== FIGUR-EDITOR ===================== -->

  get S() { return Object.assign(this.defaults(), this.state || {}); }
  get KINDS() { return ['skull', 'spine', 'ribs', 'tail', 'legs', 'arm']; }
